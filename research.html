
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Research - Xi Ning</title>
  
<style>
  body { font-family: sans-serif; background-color: #ffffff; color: #003366; max-width: 900px; margin: auto; padding: 2em; line-height: 1.6; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2em; border-bottom: 2px solid #003366; padding-bottom: 1em; }
  nav a { margin-right: 20px; text-decoration: none; color: #003366; font-weight: bold; }
  nav a:hover { text-decoration: underline; }
  .active { text-decoration: underline; }
  .lang-switch { font-size: 0.9em; }
  .cn { display: none; }
  .photo { float: left; margin-right: 20px; width: 140px; border-radius: 4px; }
  .clear { clear: both; }
  @media (max-width: 600px) {
    header, .photo { flex-direction: column; text-align: center; margin: auto; float: none; }
    nav a { display: block; margin: 5px 0; }
  }
</style>
<script>
  function toggleLang(lang) {
    document.querySelectorAll('.en').forEach(e => e.style.display = lang === 'en' ? 'block' : 'none');
    document.querySelectorAll('.cn').forEach(e => e.style.display = lang === 'cn' ? 'block' : 'none');
  }
</script>

</head>
<body>
<header>
  <strong>Research</strong>
  
<nav>
  <a href="index.html">Home</a>
  <a href="research.html">Research</a>
  <a href="teaching.html">Teaching</a>
  <span class="lang-switch">
    <button onclick="toggleLang('en')">EN</button> | <button onclick="toggleLang('cn')">中</button>
  </span>
</nav>

</header>

<div class="en">
  <h2>Research</h2>
  <ul>
    <li>Survival analysis methods with censored data</li>
    <li>Semiparametric transformation models</li>
    <li>Goodness-of-fit testing and applications in biostatistics</li>
  </ul>
</div>
<div class="cn">
  <h2>研究方向</h2>
  <ul>
    <li>带删失数据的生存分析方法</li>
    <li>半参数转换模型</li>
    <li>适合度检验及其在生物统计中的应用</li>
  </ul>
</div>

</body>
</html>
